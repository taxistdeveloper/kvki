<script>
const wsAchievements = [
  {
    id: 1,
    title: "Мехатроника",
    name: "Айбек Сатыбалды",
    result: "gold",
    year: "2025",
    competition: "WorldSkills Kazakhstan — Национальный финал",
    thumbnail: "https://picsum.photos/id/1015/600/400",
    medal: "🥇 Золото"
  },
  {
    id: 2,
    title: "Веб-дизайн и разработка",
    name: "Алина Ким",
    result: "gold",
    year: "2025",
    competition: "WorldSkills Kazakhstan",
    thumbnail: "https://picsum.photos/id/201/600/400",
    medal: "🥇 Золото"
  },
  {
    id: 3,
    title: "Поварское дело",
    name: "Нурлан Ержанов",
    result: "silver",
    year: "2024",
    competition: "WorldSkills Regional",
    thumbnail: "https://picsum.photos/id/237/600/400",
    medal: "🥈 Серебро"
  },
  {
    id: 4,
    title: "Электромонтажные работы",
    name: "Данил Попов",
    result: "bronze",
    year: "2025",
    competition: "WorldSkills Kazakhstan",
    thumbnail: "https://picsum.photos/id/133/600/400",
    medal: "🥉 Бронза"
  },
  // Добавляй новые достижения сюда
];

function createWSCard(item) {
  const card = document.createElement('div');
  card.className = `group bg-white border border-cream-200 rounded-3xl overflow-hidden hover:shadow-2xl transition-all duration-300 ws-card`;
  card.dataset.result = item.result;

  card.innerHTML = `
    <div class="relative">
      <img src="${item.thumbnail}" alt="${item.title}" class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-500">
      <div class="absolute top-4 right-4 bg-white px-4 py-1 rounded-2xl text-xl shadow-md">${item.medal}</div>
    </div>
    <div class="p-6">
      <div class="flex justify-between items-start mb-3">
        <div>
          <span class="text-xs uppercase tracking-widest text-sage-600">${item.year}</span>
          <h3 class="font-semibold text-xl text-ink-800 mt-1">${item.title}</h3>
        </div>
      </div>
      <p class="text-ink-600 font-medium">${item.name}</p>
      <p class="text-ink-500 text-sm mt-1">${item.competition}</p>
    </div>
  `;
  return card;
}

function renderWS(filteredItems) {
  const gallery = document.getElementById('wsGallery');
  gallery.innerHTML = '';
  filteredItems.forEach(item => {
    gallery.appendChild(createWSCard(item));
  });
}

function filterWS(type) {
  document.querySelectorAll('button').forEach(btn => btn.classList.remove('active-filter'));
  event.currentTarget.classList.add('active-filter');

  if (type === 'all') {
    renderWS(wsAchievements);
  } else {
    const filtered = wsAchievements.filter(item => item.result === type);
    renderWS(filtered);
  }
}

// Инициализация
document.addEventListener('DOMContentLoaded', () => {
  renderWS(wsAchievements);
});
</script>
